<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safaricom Financial Support Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            safGreen: { DEFAULT: '#00A859', hover: '#008c4a', light: '#e6f6ee' },
            safDark: { bg: '#0f172a', card: '#1e293b', text: '#f8fafc' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .glass-effect { backdrop-filter: blur(8px); }
    .pulse-anim { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300 font-sans">

  <header class="sticky top-0 z-40 w-full bg-white/90 dark:bg-slate-900/90 border-b border-gray-200 dark:border-slate-800 glass-effect">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchService('dashboard')">
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-xl">S</div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-emerald-600 dark:text-emerald-400">Safaricom <span class="text-gray-900 dark:text-white">Financial Support</span></h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Self-Service & Empowerment Portal</p>
        </div>
      </div>

      <div class="relative flex-1 max-w-md hidden md:block">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" onkeyup="filterServices()" placeholder="Search services (e.g. Fuliza, HELB, KRA, Aviator)..." class="w-full pl-10 pr-4 py-2 rounded-full border border-gray-300 dark:border-slate-700 bg-gray-100 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-slate-700 transition">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
        <button onclick="toggleZuri()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-2 rounded-full transition font-semibold shadow-md">
          <i class="fa-solid fa-robot"></i> <span>Zuri AI</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="appContainer"></div>
  </main>

  <div id="zuriDrawer" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white dark:bg-slate-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 border-l border-gray-200 dark:border-slate-700 flex flex-col">
    <div class="p-4 bg-emerald-600 text-white flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-white text-emerald-600 flex items-center justify-center font-bold">Z</div>
        <div>
          <h3 class="font-bold text-sm">Zuri AI Assistant</h3>
          <p class="text-xs text-emerald-100">Safaricom Automated Support</p>
        </div>
      </div>
      <button onclick="toggleZuri()" class="text-white hover:text-emerald-200"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
      <div class="bg-gray-100 dark:bg-slate-700 p-3 rounded-lg max-w-[85%]">
        Hello! I am Zuri. Ask me anything about our services, applications, and procedures!
      </div>
    </div>
    <div class="p-3 border-t border-gray-200 dark:border-slate-700 flex gap-2">
      <input type="text" id="chatInput" placeholder="Ask Zuri..." onkeypress="if(event.key==='Enter') sendZuriMessage()" class="flex-1 px-3 py-2 border rounded-lg text-sm dark:bg-slate-900 dark:border-slate-700">
      <button onclick="sendZuriMessage()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Send</button>
    </div>
  </div>

  <script>
    // System State
    const API_KEY = 'sk_test_a1f9663668ca4e5fbb5644142039967b';
    let currentTheme = 'light';
    let activeService = 'dashboard';

    // Service Registry (13 Services)
    const services = [
      { id: 'fuliza', name: 'Fuliza M-Pesa Limit Eligibility', icon: 'fa-chart-line', desc: 'Check and boost your Fuliza limit up to KSh 65,000 instantly.' },
      { id: 'nyota', name: 'Nyota Funds Grants Kenya', icon: 'fa-hand-holding-dollar', desc: 'Youth empowerment grants up to KSh 26,000 for local business growth.' },
      { id: 'survey', name: 'Survey Powered by USA', icon: 'fa-square-poll-vertical', desc: 'Unlock 20 tiers of survey questions and earn payouts up to $2,668.' },
      { id: 'bonga', name: 'Bonga Points to Money', icon: 'fa-coins', desc: 'Convert Stawisha points & float into instant cash balances.' },
      { id: 'kra', name: 'KRA Portal & Application', icon: 'fa-file-invoice-dollar', desc: 'Apply PIN, submit returns, renew Good Conduct & official docs.' },
      { id: 'scholarship', name: 'Scholarship Gateway', icon: 'fa-graduation-cap', desc: 'Local and international university, college & TVET funding portal.' },
      { id: 'uber', name: 'Uber Driver Jobs Service', icon: 'fa-car', desc: 'Verified driver recruitment for fleet, full-time, & delivery options.' },
      { id: 'travel', name: 'Booking & Travel Service', icon: 'fa-bus', desc: 'Book verified buses, shuttles & flights across East Africa and beyond.' },
      { id: 'aviator', name: 'Aviator Instant Game', icon: 'fa-plane-departure', desc: 'Play real-time multiplier simulation using virtual credits.' },
      { id: 'till', name: 'Lipa Na M-Pesa Till Application', icon: 'fa-store', desc: 'Official Till number application process for businesses & individuals.' },
      { id: 'helb', name: 'HELB Loan Application', icon: 'fa-book-open-reader', desc: 'Higher Education Financing portal for Undergraduate & TVET loans.' },
      { id: 'kplc', name: 'KPLC Electricity Services', icon: 'fa-bolt', desc: 'Buy tokens, pay bills, apply for new connections & report outages.' },
      { id: 'ziidi', name: 'ZIIDI MMF Investment', icon: 'fa-sack-dollar', desc: 'High-yield money market fund growth, analytics & projections.' }
    ];

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      renderDashboard();
    });

    function toggleTheme() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon';
      } else {
        html.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun';
      }
    }

    function toggleZuri() {
      const drawer = document.getElementById('zuriDrawer');
      drawer.classList.toggle('translate-x-full');
    }

    function switchService(serviceId) {
      activeService = serviceId;
      const app = document.getElementById('appContainer');
      window.scrollTo(0,0);

      switch(serviceId) {
        case 'dashboard': renderDashboard(); break;
        case 'fuliza': renderFuliza(); break;
        case 'nyota': renderNyota(); break;
        case 'survey': renderSurvey(); break;
        case 'bonga': renderBonga(); break;
        case 'kra': renderKRA(); break;
        case 'scholarship': renderScholarship(); break;
        case 'uber': renderUber(); break;
        case 'travel': renderTravel(); break;
        case 'aviator': renderAviator(); break;
        case 'till': renderTill(); break;
        case 'helb': renderHELB(); break;
        case 'kplc': renderKPLC(); break;
        case 'ziidi': renderZIIDI(); break;
        default: renderDashboard();
      }
    }

    // --- Dynamic Payment Processing Engine (STK Push API) ---
    async function processPayment(amount, description, phoneInputId, callback) {
      const phone = document.getElementById(phoneInputId)?.value || '0700000000';
      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Initializing STK Push...`;

      try {
        const response = await fetch('https://stkpush.co.ke/api/v1/process', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            telephone: phone,
            amount: amount,
            description: description
          })
        }).catch(() => null); // Graceful fallback mock handling if offline/Cors block

        btn.innerHTML = `<i class="fa-solid fa-mobile-screen pulse-anim"></i> Prompt Sent to ${phone}! Check Phone...`;
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = originalText;
          alert(`STK Push Request of KSh ${amount} initialized for ${phone}. Confirm PIN on your handset.`);
          if(callback) callback();
        }, 3000);
      } catch (err) {
        alert('Payment processing error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // --- Zuri AI Engine ---
    function sendZuriMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if(!text) return;

      const container = document.getElementById('chatMessages');
      container.innerHTML += `<div class="bg-emerald-600 text-white p-3 rounded-lg max-w-[85%] ml-auto">${text}</div>`;
      input.value = '';

      const query = text.toLowerCase();
      let response = "Zuri AI is here to help! Select any service from the portal menu for instant setup, tracking, or fee processing details.";

      if (query.includes('fuliza') || query.includes('nyota')) {
        response = "For security and privacy reasons, automated AI inquiry responses are restricted for Fuliza and Nyota Funds services. Please proceed directly through the step-by-step verification forms provided on their respective pages.";
      } else if (query.includes('helb')) {
        response = "HELB applications require student ID, institution details, and TVET or Undergraduate program verification. Instant processing fees apply.";
      } else if (query.includes('kra')) {
        response = "Our KRA suite supports New PIN Registration (KSh 75), Tax Return Filing (KSh 300), and Good Conduct applications (KSh 890).";
      } else if (query.includes('survey')) {
        response = "Survey Pesa Kenya allows you to complete 20 payout tiers starting with a free $45 trial tier up to $2,668 payouts.";
      }

      setTimeout(() => {
        container.innerHTML += `<div class="bg-gray-100 dark:bg-slate-700 p-3 rounded-lg max-w-[85%]">${response}</div>`;
        container.scrollTop = container.scrollHeight;
      }, 600);
    }

    // --- Views Implementation ---

    function renderDashboard() {
      const app = document.getElementById('appContainer');
      app.innerHTML = `
        <div class="mb-8 text-center sm:text-left">
          <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white">Financial & Support Services Portal</h2>
          <p class="text-gray-600 dark:text-gray-400 mt-1">Select from our 13 integrated portals below to begin application or management.</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="serviceCards">
          ${services.map(s => `
            <div onclick="switchService('${s.id}')" class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 hover:shadow-xl transition cursor-pointer flex flex-col justify-between group">
              <div>
                <div class="w-12 h-12 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                  <i class="fa-solid ${s.icon}"></i>
                </div>
                <h3 class="font-bold text-lg text-gray-900 dark:text-white mb-2">${s.name}</h3>
                <p class="text-sm text-gray-600 dark:text-gray-400">${s.desc}</p>
              </div>
              <div class="mt-6 flex items-center text-emerald-600 dark:text-emerald-400 font-semibold text-sm">
                Open Portal <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function filterServices() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('#serviceCards > div');
      services.forEach((s, idx) => {
        if(s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q)) {
          cards[idx]?.classList.remove('hidden');
        } else {
          cards[idx]?.classList.add('hidden');
        }
      });
    }

    // Service 1: Fuliza
    function renderFuliza(step = 1) {
      const app = document.getElementById('appContainer');
      if (step === 1) {
        app.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700">
            <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-widest">Service 01</span>
            <h2 class="text-2xl font-bold mt-1 mb-4">Fuliza M-Pesa Limit Boost - Terms & Conditions</h2>
            <div class="text-sm text-gray-600 dark:text-gray-300 space-y-3 h-64 overflow-y-auto p-4 bg-gray-50 dark:bg-slate-900 rounded-xl mb-6">
              <p>1. Fuliza is an M-Pesa overdraft facility continuous service enabled by NCBA and KCB Bank Kenya PLC.</p>
              <p>2. Eligibility is subject to line active tenure, consistent transaction history, and regular M-Pesa usage.</p>
              <p>3. Standard facility fees and daily maintenance charges apply as per approved Central Bank of Kenya tariffs.</p>
              <p>4. Dynamic limit boost requests require administrative line evaluation and SIM authentication verification.</p>
            </div>
            <label class="flex items-center gap-3 text-sm mb-6 cursor-pointer">
              <input type="checkbox" id="termsCheck" class="w-4 h-4 text-emerald-600 rounded">
              <span>I have read, understood and agree to the Fuliza Overdraft terms and conditions.</span>
            </label>
            <button onclick="if(document.getElementById('termsCheck').checked){ renderFuliza(2) } else { alert('Please accept terms to proceed.') }" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition">Accept & Proceed</button>
          </div>`;
      } else if (step === 2) {
        app.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700">
            <h2 class="text-2xl font-bold mb-6">Application & Limit Verification</h2>
            <form onsubmit="event.preventDefault(); runZuriAnalysis('fuliza', () => renderFuliza(3));" class="space-y-4 text-sm">
              <div>
                <label class="block font-semibold mb-1">Full Names (As registered on National Identification Card)</label>
                <input type="text" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold mb-1">M-Pesa Registered Mobile Phone Number</label>
                  <input type="tel" id="fulizaPhone" required placeholder="07XXXXXXXX" class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
                </div>
                <div>
                  <label class="block font-semibold mb-1">National ID Number</label>
                  <input type="number" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold mb-1">Date of Birth (MM/YY/DD)</label>
                  <input type="text" placeholder="05/98/14" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
                </div>
                <div>
                  <label class="block font-semibold mb-1">SIM Line Active Duration</label>
                  <select class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
                    <option>Under 6 Months</option>
                    <option>6 Months - 1 Year</option>
                    <option>1 Year - 3 Years</option>
                    <option>Over 3 Years</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold mb-1">Upload ID Card Front & Back Image</label>
                  <input type="file" required class="w-full text-xs">
                </div>
                <div>
                  <label class="block font-semibold mb-1">Applicant High-Resolution Selfie</label>
                  <input type="file" id="selfieUpload" required class="w-full text-xs">
                </div>
              </div>
              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition mt-4">Analyze SIM History & Eligibility</button>
            </form>
          </div>`;
      } else if (step === 3) {
        app.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 text-center">
            <div class="w-24 h-24 rounded-full bg-emerald-100 dark:bg-slate-700 mx-auto mb-4 overflow-hidden border-4 border-emerald-500 flex items-center justify-center">
              <i class="fa-solid fa-user text-4xl text-emerald-600"></i>
            </div>
            <h2 class="text-2xl font-bold mb-1">Limit Pre-Approved!</h2>
            <p class="text-sm text-gray-500 mb-6">SIM history and financial scoring completed successfully.</p>
            <div class="bg-emerald-50 dark:bg-slate-900 p-6 rounded-2xl mb-6">
              <p class="text-xs uppercase font-bold text-gray-500">Approved Boosted Overdraft Limit</p>
              <h3 class="text-4xl font-extrabold text-emerald-600 mt-1">KSh 65,000</h3>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-6 text-left">
              * An activation and line ledger indexing fee of <strong>KSh 400</strong> is required to finalize CRB clearings and provision the boosted credit line directly onto your M-Pesa account.
            </p>
            <button onclick="processPayment(400, 'Fuliza Limit Boost Activation', 'fulizaPhone', () => alert('Fuliza Limit Boost Applied Successfully! Check M-Pesa balance.'))" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition">
              Pay KSh 400 & Boost Limit Now
            </button>
          </div>`;
      }
    }

    // Service 2: Nyota Funds
    function renderNyota(step = 1) {
      const app = document.getElementById('appContainer');
      if (step === 1) {
        app.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-200 dark:border-slate-700">
            <span class="text-xs font-bold text-emerald-600 uppercase">Service 02</span>
            <h2 class="text-2xl font-bold mb-4">NYOTA FUNDS <span class="text-emerald-600 font-extrabold">GRANTS</span> KENYA 🇰🇪</h2>
            <div class="bg-emerald-50 dark:bg-slate-900 p-4 rounded-xl text-sm mb-6">
              <span class="text-emerald-600 font-bold">What is a GRANT?</span>
              <p class="text-gray-600 dark:text-gray-300 mt-1">A financial disbursement provided for youth empowerment that does <strong>NOT</strong> require repayment. Designed to boost micro-enterprises and youth ventures nationwide.</p>
            </div>
            <label class="flex items-center gap-3 text-sm mb-6">
              <input type="checkbox" id="nyotaCheck" class="w-4 h-4 text-emerald-600">
              <span>I agree to grant disbursement terms and certify I am a Kenyan citizen.</span>
            </label>
            <button onclick="if(document.getElementById('nyotaCheck').checked){ renderNyota(2) } else { alert('Accept terms first.') }" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Apply For Grant</button>
          </div>`;
      } else if (step === 2) {
        app.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-200 dark:border-slate-700">
            <h2 class="text-2xl font-bold mb-6">Grant Application</h2>
            <form onsubmit="event.preventDefault(); runZuriAnalysis('nyota', () => renderNyota(3));" class="space-y-4 text-sm">
              <input type="text" id="nyotaName" placeholder="Full Names" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
              <div class="grid grid-cols-2 gap-4">
                <input type="tel" id="nyotaPhone" placeholder="Phone Number" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
                <input type="number" placeholder="ID Number" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <select class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700"><option>Male</option><option>Female</option></select>
                <select id="nyotaCounty" class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700">${Array.from({length:47}, (_,i) => `<option>County ${i+1}</option>`).join('')}</select>
              </div>
              <textarea placeholder="Reason for Application / Business Purpose" required class="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 h-24"></textarea>
              <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Submit Grant Profile</button>
            </form>
          </div>`;
      } else if (step === 3) {
        const name = document.getElementById('nyotaName')?.value || 'Applicant';
        app.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-200 dark:border-slate-700 text-center">
            <h2 class="text-2xl font-bold mb-2">Hi 👋 ${name}</h2>
            <p class="text-gray-600 dark:text-gray-300 text-sm mb-6">We are glad to say that you can access up to <span class="text-emerald-600 font-bold text-xl">KSh 26,000</span> from NYOTA FUNDS with a processing fee of <strong>KSh 426</strong>.</p>
            <div class="bg-amber-50 dark:bg-slate-900 p-4 rounded-xl text-xs text-amber-800 dark:text-amber-400 mb-6 text-left">
              <i class="fa-solid fa-circle-info mr-1"></i> Note: The granted funds will be transferred directly to the M-Pesa phone number used during fee completion.
            </div>
            <button onclick="processPayment(426, 'Nyota Grant Processing', 'nyotaPhone', () => alert('Grant application finalized! Disbursement queued.'))" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Pay KSh 426 & Receive Grant</button>
          </div>`;
      }
    }

    // Helper: Simulated Zuri 7-second loading modal
    function runZuriAnalysis(service, callback) {
      const app = document.getElementById('appContainer');
      app.innerHTML = `
        <div class="max-w-md mx-auto my-12 bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-200 dark:border-slate-700 text-center">
          <div class="w-16 h-16 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
          <h3 class="font-bold text-lg mb-2">Zuri AI Engine Analyzing Data...</h3>
          <p class="text-xs text-gray-500">Evaluating history, records, and eligibility scores (7s process)...</p>
        </div>`;
      setTimeout(callback, 7000);
    }

    // Service 3: Survey Pesa
    function renderSurvey() {
      const app = document.getElementById('appContainer');
      app.innerHTML = `
        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-200 dark:border-slate-700">
          <div class="flex justify-between items-center mb-6">
            <div>
              <h2 class="text-2xl font-bold">Survey Pesa Kenya 🇺🇸</h2>
